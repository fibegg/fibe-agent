# Fibe Agent configuration. Save as /app/fibe.yml in Docker or ./fibe.yml locally.
# Every key is optional. Priority, highest first:
#   1. Individual environment variables such as AGENT_PROVIDER
#   2. FIBE_SETTINGS_JSON env var (JSON blob)
#   3. This file (fibe.yml)
# FIBE_API_KEY, FIBE_DOMAIN, FIBE_AGENT_ID, and FIBE_HOST_ID always come
# from the environment because the Go SDK and CLI consume them directly.

# Agent Core

# AI provider backend.
# Supported: gemini, antigravity, claude-code, openai-codex, opencode, cursor
# Default: claude-code
# agentProvider: gemini

# Password required to access the agent chat UI.
# When unset, the UI is open (no authentication prompt).
# agentPassword: my-secret

# Provider authentication mode, such as "api_key" or "oauth".
# agentAuthMode: api_key

# Models shown in the selector. Accepts a comma-separated string or YAML list.
# When unset, the provider supplies the list.
# modelOptions: flash-lite,flash,pro
#
# Or as a YAML list:
# modelOptions:
#   - flash-lite
#   - flash
#   - pro

# Default model selected on startup.
# When unset, the first entry from modelOptions is used.
# defaultModel: flash

# System prompt for every conversation. Overrides dist/assets/SYSTEM_PROMPT.md.
# systemPrompt: |
#   You are a TypeScript expert.
#   Always use strict mode.
#   Prefer functional patterns.

# Lock the model selector: users cannot switch models in the UI.
# Default: false
# lockChatModel: true

# Start with Simplicate switched on, using the compact chat header.
# Users can still toggle it from the actions menu.
# Default: false
# simplicate: true

# Paths & Storage

# Root directory for persistent data (conversations, activity, uploads).
# Default: <cwd>/data
# dataDir: /app/data

# Provider session workspace, used by Cursor and derived from dataDir if unset.
# sessionDir: /app/sessions

# Host root used to find and link local Playgrounds.
# Default: /opt/fibe
# hostRoot: /opt/fibe

# Root domain for Playground routing. "dev.example.com" yields subdomains such
# as "web.dev.example.com".
# hostRootDomain: dev.example.com

# Encryption key for at-rest data encryption.
# When unset, data is stored unencrypted.
# encryptionKey: my-32-byte-encryption-key-here!

# Fibe Platform Sync

# Sync messages and activity to Fibe. Requires FIBE_API_KEY and FIBE_DOMAIN.
# Default: false
# fibeSyncEnabled: true

# Lifecycle Scripts

# Shell commands run once before Chat accepts messages.
# postInitScript: |
#   npm install
#   npm run db:migrate

# MCP (Model Context Protocol) Servers
#
# External MCP servers. The agent writes provider-specific configuration at
# startup. Use serverUrl for remote HTTP or command and args for local stdio.
#
# mcpConfig:
#   mcpServers:
#     # Remote MCP server with auth
#     fibe:
#       serverUrl: https://fibe.gg
#       authHeader: "Bearer ${env:FIBE_API_KEY}"
#
#     # Remote MCP server without auth
#     sentry:
#       serverUrl: https://mcp.sentry.dev/mcp
#
#     # Stdio MCP server (local process)
#     github:
#       command: npx
#       args:
#         - -y
#         - "@modelcontextprotocol/server-github"
#       env:
#         GITHUB_PERSONAL_ACCESS_TOKEN: ghp_xxxxxxxxxxxx
#
#     # Fibe CLI as an MCP server
#     fibe-local:
#       command: fibe
#       args:
#         - mcp
#         - serve
#         - --tools
#         - core
#         - --yolo

# Timeout (ms) for ask_user MCP tool prompts before auto-declining.
# Default: 300000 (5 minutes)
# askUserTimeoutMs: 300000

# Cascade Settings
#
# Fibe normally sets these through Admin, Player, and Agent defaults. Override
# them here for local or standalone use.

# Version of the Fibe CLI binary to use.
# When managed by the platform, this is set automatically.
# cliVersion: "0.9.42"

# Extra CLI arguments passed to the AI provider process.
# Keys and values depend on the provider. Example for claude-code:
# providerArgs:
#   max-tokens: 8192
#   permission-mode: plan

# Toggle individual agent skills on or off.
# skillToggles:
#   web-search: true
#   code-execution: false

# Enable system health checks on agent startup.
# Default: true
# syscheckEnabled: true

# Credentials & Runtime Files
#
# Fibe-managed JSON values. Usually configured through Admin or Player settings.

# JSON blob of credentials (API keys, tokens) injected at runtime.
# agentCredentialsJson: '{"OPENAI_API_KEY":"sk-..."}'

# JSON blob of files to materialize in the agent workspace at startup.
# agentRuntimeFilesJson: '[{"path":".env","content":"DATABASE_URL=..."}]'

# Gemma Router (Local LLM Pre-processor)
#
# Optionally classify requests with a local Gemma model before the cloud model.

# Enable the Gemma Router.
# Default: false
# gemmaRouterEnabled: true

# Ollama server URL.
# Default: http://localhost:11434
# ollamaUrl: http://ollama:11434

# Gemma model identifier in Ollama.
# Default: gemma3:4b
# gemmaModel: gemma3:4b

# Confidence threshold (0.0 to 1.0).
# Scores above this threshold use Gemma; lower scores use the cloud model.
# Default: 0.8
# gemmaConfidenceThreshold: 0.8

# Timeout (ms) for Gemma inference calls.
# Default: 30000
# gemmaTimeoutMs: 30000

# Upload Processing & OCR

# Largest source image converted to PNG for OCR. Applies to WebP, AVIF, HEIC,
# BMP, and TIFF; JPEG and PNG go directly to OCR.
# Env: FIBE_OCR_CONVERSION_MAX_BYTES
# Default: 10485760 (10 MiB)
# ocrConversionMaxBytes: 10485760

# Largest converted PNG accepted for OCR, limiting decoder expansion.
# Env: FIBE_OCR_CONVERSION_MAX_OUTPUT_BYTES
# Default: 26214400 (25 MiB)
# ocrConversionMaxOutputBytes: 26214400

# UI & Chat Appearance

# User avatar as a URL or inline base64 value.
# userAvatarUrl: https://example.com/avatars/user.png
# userAvatarBase64: "data:image/png;base64,iVBORw0KGgo..."

# Assistant avatar as a URL or inline base64 value.
# assistantAvatarUrl: https://example.com/avatars/bot.png
# assistantAvatarBase64: "data:image/png;base64,iVBORw0KGgo..."

# Security & Embedding

# Comma-separated CORS origins for the HTTP API.
# corsOrigins: https://app.example.com,https://admin.example.com

# CSP frame ancestors allowed to embed Chat.
# frameAncestors: https://parent.example.com
