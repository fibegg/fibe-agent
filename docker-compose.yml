# Prebuilt image: copy .env.example to .env, then run `docker compose up`.
# Mount data directories only; mounting the project over /app hides the build.

services:
  agent:
    image: ghcr.io/fibegg/fibe-agent:${AGENT_PROVIDER:-gemini}-latest
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      PORT: '3000'
    volumes:
      - ./data:/app/data
      - ./playground:/app/playground
    # Optional system prompt:
    # - ./my-system-prompt.md:/app/system-prompt.md
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
