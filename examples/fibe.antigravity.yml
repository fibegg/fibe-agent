# Generated Google Antigravity configuration, mounted at /app/fibe.yml.

agentProvider: antigravity
agentAuthMode: api-token
agentPassword: pg-internal-abc123def456

# Refresh models in Chat to query the CLI's available model slugs. Empty default
# lets the CLI choose its current account/provider default.
modelOptions: ''
defaultModel: ''

systemPrompt: |
  You are an expert TypeScript developer. Keep changes focused and verify them.

dataDir: /app/data
sessionDir: /app/data/42/.gemini
marqueeRootDomain: my-marquee.fibe.gg

fibeSyncEnabled: true

postInitScript: |
  npm install 2>/dev/null || true

# For API-token mode, the runtime sets modelProvider=gemini in the CLI's
# settings.json and passes the key as GEMINI_API_KEY. Supply a real key through
# protected runtime settings. OAuth mode instead uses the Chat sign-in flow.
credentialEnv:
  GEMINI_API_KEY: AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

providerArgs:
  print-timeout: 30m

skillToggles:
  token-saver: true

syscheckEnabled: true

mcpConfig:
  mcpServers:
    fibe:
      command: fibe
      args:
        - mcp
        - serve
        - '--tools'
        - core
      env:
        FIBE_API_KEY: fibe_live_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        FIBE_DOMAIN: fibe.gg
    filesystem:
      command: npx
      args:
        - '-y'
        - '@modelcontextprotocol/server-filesystem'
        - /app/data/42/antigravity_workspace

userAvatarUrl: https://avatars.githubusercontent.com/u/12345678
lockChatModel: false

corsOrigins: 'https://fibe.gg https://*.fibe.gg'
frameAncestors: 'https://fibe.gg https://*.fibe.gg'
