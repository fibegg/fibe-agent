# Local development: `docker compose -f docker-compose.dev.yml up`

services:
  agent-dev:
    image: node:24-slim
    working_dir: /app
    restart: unless-stopped

    # Nx requires a TTY here to avoid addRunningTask failures.
    tty: true
    stdin_open: true

    ports:
      - '${PORT:-3000}:3000' # API + static chat UI
      - '3100:3100' # Vite dev server (hot-reload)

    env_file:
      - .env
    environment:
      PORT: '3000'
      NODE_ENV: 'development'
      # The Nx daemon is unstable without a persistent process manager.
      NX_DAEMON: 'false'
      # Use the JS watcher because host-native binaries may not load in Linux.
      NX_NATIVE_FILE_WATCHER: 'false'

    volumes:
      - .:/app
      # Isolate dependencies from incompatible host binaries.
      - node_modules_dev:/app/node_modules
      - ./data:/app/data
      - ./playground:/app/playground

    # node:24-slim lacks Bun, so install and run with npm/npx.
    command: >
      sh -c "
        npm install --prefer-offline --no-audit --no-fund &&
        npx nx run-many --targets=serve,dev --parallel=2
      "

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  node_modules_dev:
